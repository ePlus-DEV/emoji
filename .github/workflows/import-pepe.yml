name: Import Pepe Emoji

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum Pepe emoji items to import in this run
        required: true
        default: '10000'
        type: string
  schedule:
    # Weekly on Wednesday at 04:30 UTC = 11:30 Asia/Ho_Chi_Minh
    - cron: '30 4 * * 3'
  push:
    paths:
      - '.github/workflows/import-pepe.yml'
      - 'scripts/import-pepe.mjs'
      - 'package.json'

permissions:
  contents: write

# All emoji writers share one lock so JSON/index commits never race each other.
concurrency:
  group: emoji-data-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # Push/manual runs fill the catalog aggressively; the weekly refresh stays lighter.
      IMPORT_LIMIT: ${{ github.event_name == 'schedule' && '500' || github.event.inputs.limit || '10000' }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Import Pepe emoji from Emoji.gg
        run: |
          node scripts/import-pepe.mjs \
            --limit="$IMPORT_LIMIT" \
            --concurrency=8 \
            --max-pages=500

      - name: Verify emoji index
        run: npm run check:data

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/api/emojis.json src/data/emojis.json
          if [ -f src/data/community-sync-state.json ]; then
            git add src/data/community-sync-state.json
          fi
          if [ -d public/emojis/community/emojigg-pepe ]; then
            git add public/emojis/community/emojigg-pepe
          fi

          if git diff --cached --quiet; then
            echo "No Pepe emoji updates found."
            exit 0
          fi

          git commit -m "chore: import Pepe emoji"
          git push origin HEAD:main
