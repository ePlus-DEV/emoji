name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify emoji data
        run: npm run check:data

      - name: Build
        run: npm run build

      - name: Verify built links
        run: npm run check:build

      - name: Install Chromium for PR preview
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        if: github.event_name == 'pull_request'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/emoji-pr-preview.log 2>&1 &
          echo $! > /tmp/emoji-pr-preview.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then
              echo "Preview server is ready."
              exit 0
            fi
            sleep 1
          done

          cat /tmp/emoji-pr-preview.log
          echo "Preview server did not become ready in time." >&2
          exit 1

      - name: Capture PR preview screenshots
        if: github.event_name == 'pull_request'
        run: node scripts/capture-pr-preview.mjs

      - name: Upload PR preview screenshots
        if: github.event_name == 'pull_request'
        id: preview_artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.number }}
          path: artifacts/pr-preview/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Add preview to job summary
        if: github.event_name == 'pull_request'
        env:
          ARTIFACT_URL: ${{ steps.preview_artifact.outputs.artifact-url }}
        run: |
          {
            echo '## UI preview'
            echo
            echo 'Desktop and mobile screenshots were generated from this PR build.'
            echo
            echo "[Download preview screenshots]($ARTIFACT_URL)"
            echo
            echo '- Home — desktop'
            echo '- Emoji library — desktop'
            echo '- Home — mobile'
            echo '- Emoji library — mobile'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post preview link on PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.preview_artifact.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- emoji-ui-pr-preview -->';
            const body = `${marker}\n## 🖥️ UI Preview\n\nA fresh visual preview was generated for commit \`${context.sha.slice(0, 7)}\`.\n\n**[Download desktop + mobile screenshots](${process.env.ARTIFACT_URL})**\n\nIncluded views:\n- Home — desktop\n- Emoji library — desktop\n- Home — mobile\n- Emoji library — mobile\n\n> Generated automatically from the built Astro site. The artifact is retained for 14 days.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Stop preview server
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ -f /tmp/emoji-pr-preview.pid ]; then
            kill "$(cat /tmp/emoji-pr-preview.pid)" 2>/dev/null || true
          fi
