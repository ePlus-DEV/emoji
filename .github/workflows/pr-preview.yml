name: PR Live Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-live-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PREVIEW_BRANCH: pr-preview-${{ github.event.pull_request.number }}
      PR_PREVIEW_BASE: /${{ github.repository }}/pr-preview-${{ github.event.pull_request.number }}/
      PR_PREVIEW_SITE: https://raw.githack.com/${{ github.repository }}/pr-preview-${{ github.event.pull_request.number }}/
      PREVIEW_URL: https://raw.githack.com/${{ github.repository }}/pr-preview-${{ github.event.pull_request.number }}/index.html
      PREVIEW_HEALTH_URL: https://raw.githubusercontent.com/${{ github.repository }}/pr-preview-${{ github.event.pull_request.number }}/index.html

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify emoji data
        run: npm run check:data

      - name: Build live preview
        run: npm run build

      - name: Prepare preview routes
        run: node scripts/prepare-pr-preview.mjs

      - name: Publish preview branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          preview_dir="$(mktemp -d)"
          cp -a dist/. "$preview_dir/"
          cd "$preview_dir"

          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$PREVIEW_BRANCH"
          git add -A
          git commit -q -m "preview: PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:${PREVIEW_BRANCH}"

      - name: Wait for published preview
        run: |
          set -euo pipefail

          # Verify the branch directly on GitHub instead of using raw.githack as a
          # CI health check. raw.githack is a third-party CDN and can be delayed or
          # blocked independently of whether the preview branch was published.
          for attempt in {1..36}; do
            if curl --fail --silent --show-error --location \
              --max-time 10 \
              "$PREVIEW_HEALTH_URL" | grep -q 'ePlus Emoji'; then
              echo "Preview branch is published: $PREVIEW_HEALTH_URL"
              echo "Browser preview: $PREVIEW_URL"
              exit 0
            fi

            echo "Waiting for GitHub preview branch ($attempt/36)..."
            sleep 5
          done

          echo "Preview branch did not become readable from GitHub in time." >&2
          exit 1

      - name: Add live preview to job summary
        run: |
          {
            echo '## 🌐 Live PR preview'
            echo
            echo "[Open the live site]($PREVIEW_URL)"
            echo
            echo 'This is a real static deployment of the PR build. Navigation, search, filters, pagination, detail pages, downloads, and responsive behavior can be tested in the browser.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update live preview link on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            const marker = '<!-- emoji-live-pr-preview -->';
            const shortSha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n## 🌐 Live Preview\n\n**[Open PR preview →](${process.env.PREVIEW_URL})**\n\nBuilt from commit \`${shortSha}\`. This is an interactive site, not a screenshot — you can test navigation, search, filters, pagination, emoji detail pages and responsive layout.\n\n> The preview updates automatically when this PR receives a new commit. It is served from a disposable \`pr-preview-${context.issue.number}\` branch through raw.githack and is not the production site.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
