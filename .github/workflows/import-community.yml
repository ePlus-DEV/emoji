name: Import Community Emoji

on:
  workflow_dispatch:
    inputs:
      source:
        description: Community source to import
        required: true
        default: all
        type: choice
        options:
          - all
          - slackmojis
          - discadia
      limit:
        description: Maximum emoji detail pages per source
        required: true
        default: '60'
        type: string
  schedule:
    # Every day at 04:10 UTC = 11:10 Asia/Ho_Chi_Minh
    - cron: '10 4 * * *'
  push:
    paths:
      - '.github/workflows/import-community.yml'
      - 'scripts/import-community.mjs'
      - 'package.json'

permissions:
  contents: write

# Shared with Pepe importer so both workflows never write emoji JSON at once.
concurrency:
  group: emoji-data-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMPORT_SOURCE: ${{ github.event.inputs.source || 'all' }}
      IMPORT_LIMIT: ${{ github.event_name == 'push' && '10' || github.event.inputs.limit || '60' }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Import Slackmojis and Discadia
        run: |
          npm run import:community -- \
            --source="$IMPORT_SOURCE" \
            --limit="$IMPORT_LIMIT" \
            --concurrency=4

      - name: Verify emoji index
        run: npm run check:data

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/api/emojis.json src/data/emojis.json
          if [ -f src/data/community-sync-state.json ]; then
            git add src/data/community-sync-state.json
          fi
          if [ -d public/emojis/community ]; then
            git add public/emojis/community
          fi

          if git diff --cached --quiet; then
            echo "No community emoji updates found."
            exit 0
          fi

          git commit -m "chore: import community emoji"
          git push origin HEAD:main
