name: Import Emoji.gg Catalog

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Category to import: all, pepe, anime, gaming, category ID, or comma-separated values"
        required: true
        default: "all"
        type: string
      limit_per_category:
        description: "Maximum missing emoji to import per category. Use 0 only for an intentional full manual import."
        required: true
        default: "250"
        type: string
      max_pages_per_category:
        description: "Safety cap for category pagination"
        required: true
        default: "1500"
        type: string
  schedule:
    # Once per day at 10:17 Asia/Ho_Chi_Minh (03:17 UTC).
    - cron: "17 3 * * *"

permissions:
  contents: write

# Serialize every workflow that writes emoji indexes/assets.
concurrency:
  group: emoji-data-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      IMPORT_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.category || 'all' }}
      # Scheduled runs stay deliberately small. Manual runs can override this.
      IMPORT_LIMIT_PER_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.limit_per_category || '75' }}
      IMPORT_MAX_PAGES_PER_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_pages_per_category || '750' }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Import Emoji.gg catalog
        run: |
          echo "Category: $IMPORT_CATEGORY"
          echo "Limit/category: $IMPORT_LIMIT_PER_CATEGORY (0 = all missing)"
          echo "Max pages/category: $IMPORT_MAX_PAGES_PER_CATEGORY"

          node scripts/import-emojigg.mjs \
            --category="$IMPORT_CATEGORY" \
            --limit-per-category="$IMPORT_LIMIT_PER_CATEGORY" \
            --max-pages-per-category="$IMPORT_MAX_PAGES_PER_CATEGORY" \
            --empty-page-stop=3 \
            --concurrency=8

      - name: Verify emoji index
        run: npm run check:data

      - name: Show import summary
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const emojis = JSON.parse(await readFile('src/data/emojis.json', 'utf8'));
          const categories = JSON.parse(await readFile('src/data/categories.json', 'utf8').catch(() => '[]'));
          const emojigg = emojis.filter((item) => item.source === 'emojigg');
          console.log(`Emoji.gg indexed: ${emojigg.length}`);
          console.log(`All emoji indexed: ${emojis.length}`);
          console.log(`Emoji.gg categories: ${categories.length}`);
          for (const category of categories) {
            console.log(`- ${category.name}: ${category.count} (${category.animated} animated, ${category.static} static)`);
          }
          NODE

      - name: Commit imported assets and indexes
        id: import_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/api/emojis.json src/data/emojis.json src/data/community-sync-state.json

          if [ -f src/data/categories.json ]; then
            git add src/data/categories.json
          fi
          if [ -f public/api/categories.json ]; then
            git add public/api/categories.json
          fi
          if [ -d public/emojis/community/emojigg ]; then
            git add public/emojis/community/emojigg
          fi

          if git diff --cached --quiet; then
            echo "No Emoji.gg updates found."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: import Emoji.gg catalog"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push imported commit safely
        if: steps.import_commit.outputs.created == 'true'
        run: |
          set -e

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Could not rebase the import commit onto the latest main. Keeping the local import commit for rescue." >&2
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Import pushed successfully."
              exit 0
            fi

            echo "main changed again while pushing; retrying..."
            sleep $((attempt * 5))
          done

          echo "Push failed after 3 attempts. The rescue artifact step will preserve this import." >&2
          exit 1

      - name: Create rescue archive after push failure
        if: failure() && steps.import_commit.outputs.created == 'true'
        run: |
          git rebase --abort 2>/dev/null || true
          RESCUE="/tmp/emojigg-import-${GITHUB_RUN_ID}.tar"
          git diff-tree --no-commit-id --name-only -r -z HEAD > /tmp/emojigg-import-files.zlist
          tar --null -T /tmp/emojigg-import-files.zlist -cf "$RESCUE"
          echo "Rescue archive: $RESCUE"
          echo "RESCUE_ARCHIVE=$RESCUE" >> "$GITHUB_ENV"

      - name: Upload rescue artifact
        if: failure() && steps.import_commit.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: emojigg-import-rescue-${{ github.run_id }}
          path: ${{ env.RESCUE_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
